name: Production source gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo:check && pnpm prod:check && pnpm seo:check
      - run: pnpm typecheck && pnpm lint
      - run: pnpm fixtures && pnpm test && pnpm schema:check
      - run: node scripts/test-password-runtime.mjs
      - run: node scripts/check-source-secrets.mjs && pnpm security:check
      - run: pnpm compat:check
      - run: pnpm build && node scripts/check-performance-budget.mjs
      - run: node scripts/generate-sbom.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence
          path: |
            artifacts/
            playwright-report/
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
# This workflow has no production credentials, migration apply or deployment.

  # Visual baselines are generated and validated on the same Windows runner/browser matrix used here.
  browser:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      VISUAL_REGRESSION: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm test:e2e --project chromium --project webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 3
