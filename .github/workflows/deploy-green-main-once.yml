name: Deploy validated SellerHisab release once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-green-main-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact green production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0a11795833fb5628e304b4d8bd4fc8c660701ead
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0a11795833fb5628e304b4d8bd4fc8c660701ead"
          pnpm repo:check
          pnpm prod:check

      - name: Verify Cloudflare authentication
        run: pnpm cloudflare:whoami

      - name: Deploy to production
        run: pnpm deploy

# Deliberately no D1 migration command in this workflow.
