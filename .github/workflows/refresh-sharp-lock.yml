name: Refresh patched Sharp lockfile
on:
  push:
    branches: [feature/marketplace-full-experience]
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/refresh-sharp-lock.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/marketplace-full-experience
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "SellerHisab CI"
          git config user.email "hisabseller-creator@users.noreply.github.com"
          git rm .github/workflows/refresh-sharp-lock.yml
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git diff --cached --quiet && { echo "No lockfile update produced"; exit 1; }
          git commit -m "security: refresh lockfile for sharp 0.35.4"
          git push origin HEAD:feature/marketplace-full-experience
