name: Refresh auth UI snapshots

on:
  push:
    branches:
      - auth-ui-cleanup-highlight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      - run: pnpm exec playwright install chromium webkit
      - name: Refresh affected Windows snapshots
        run: pnpm exec playwright test tests/e2e/critical-accessibility.spec.ts tests/e2e/mobile-accessibility.spec.ts tests/e2e/localized-article.spec.ts --project chromium --project webkit --update-snapshots
      - name: Commit refreshed snapshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          if (git diff --cached --quiet) {
            Write-Host "No snapshot changes to commit."
            exit 0
          }
          git commit -m "Test: refresh auth UI visual baselines"
          git push origin HEAD:auth-ui-cleanup-highlight
