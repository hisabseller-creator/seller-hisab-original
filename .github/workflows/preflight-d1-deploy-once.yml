name: SellerHisab production preflight once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-d1-deploy-once.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact validated release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 24b781b3c7b6a600b1441b0f384a737556ece8d0
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "24b781b3c7b6a600b1441b0f384a737556ece8d0"
          pnpm repo:check
          pnpm prod:check

      - name: Verify Cloudflare authentication
        run: pnpm cloudflare:whoami

      - name: Verify production D1 target
        run: pnpm exec wrangler d1 info seller-margin-guard --json --config wrangler.jsonc

      - name: List unapplied remote D1 migrations
        run: pnpm exec wrangler d1 migrations list DB --remote --config wrangler.jsonc

# Read-only preflight: no migration apply and no deploy.
