[extend]
useDefault = true

[allowlist]
description = "Only synthetic Amazon-remediation test fixtures and this configuration file are allowlisted."
regexTarget = "line"
paths = [
  '''(^|/)\.gitleaks\.toml$'''
]
regexes = [
  '''session-secret-for-tests-0123456789abcdef''',
  '''connector-key-for-tests-0123456789abcdef'''
]
